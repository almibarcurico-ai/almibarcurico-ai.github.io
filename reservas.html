  <style>
    :root {
      --night: #061f24;
      --deep: #07343a;
      --leaf: #0d4a42;
      --teal: #12695f;
      --paper: #fbf2dc;
      --cream: #fff7e7;
      --gold: #d7aa58;
      --coral: #d86254;
      --magenta: #af1c68;
      --blue: #71b7d6;
      --ink: #172226;
      --muted: rgba(255, 247, 231, .72);
      --line: rgba(255, 247, 231, .18);
      --shadow: 0 30px 70px rgba(0, 0, 0, .34);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--night);
    }

    body {
      margin: 0;
      color: var(--cream);
      background:
        linear-gradient(180deg, rgba(6, 31, 36, .32), rgba(6, 31, 36, .98)),
        url("./assets/src/assets/tropical-bg.61b0e22dfc663a60891e5a20d18f59a4.jpg") center top / cover fixed,
        var(--night);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .34;
      background:
        url("./flores-soft/flor-azul-soft.png") left -120px top 70px / 330px auto no-repeat,
        url("./flores-soft/flor-roja-soft.png") right -120px top 420px / 290px auto no-repeat,
        url("./flores-soft/flor-naranja-soft.png") left -130px bottom 20px / 310px auto no-repeat;
      filter: saturate(1.15);
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site {
      overflow: clip;
    }

    .hero {
      min-height: 92svh;
      display: grid;
      align-items: stretch;
      padding: 24px clamp(18px, 4vw, 64px) 38px;
    }

    .topbar {
      align-self: start;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 12px 0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255, 247, 231, .82);
    }

    .topbar img {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      box-shadow: 0 10px 34px rgba(0, 0, 0, .28);
    }

    .topbar nav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .topbar a,
    .mode-link {
      border: 1px solid rgba(255, 247, 231, .22);
      border-radius: 8px;
      padding: 9px 12px;
      background: rgba(6, 31, 36, .45);
      backdrop-filter: blur(14px);
    }

    .hero-grid {
      align-self: end;
      display: grid;
      grid-template-columns: minmax(0, .95fr) minmax(340px, .82fr);
      gap: clamp(28px, 5vw, 86px);
      align-items: end;
      width: min(1180px, 100%);
      margin: 0 auto;
      padding-top: 26px;
    }

    .hero-copy {
      max-width: 680px;
      padding-bottom: clamp(10px, 4vh, 46px);
    }

    .brand-script {
      margin: 0 0 8px;
      color: var(--gold);
      font-family: "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(44px, 9vw, 118px);
      font-weight: 700;
      line-height: .82;
      letter-spacing: 0;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-family: "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(52px, 10vw, 150px);
      line-height: .84;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .hero-copy p {
      max-width: 58ch;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 22px);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .hero-actions a {
      min-width: 154px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      padding: 14px 18px;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
      border: 1px solid rgba(255, 247, 231, .24);
    }

    .hero-actions a:first-child {
      color: #211610;
      background: var(--gold);
      border-color: var(--gold);
    }

    .hero-actions a:last-child {
      background: rgba(255, 247, 231, .08);
      backdrop-filter: blur(12px);
    }

    .hero-prompt {
      margin-top: 34px;
      color: var(--gold);
      font-family: "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(26px, 3.4vw, 46px);
      font-weight: 800;
      line-height: 1;
    }

    .service-strip {
      padding: 34px clamp(18px, 4vw, 64px);
      background:
        linear-gradient(90deg, rgba(76, 18, 65, .9), rgba(7, 52, 58, .92)),
        url("./flores-soft/flor-roja-soft.png") right -100px center / 260px auto no-repeat;
      border-block: 1px solid rgba(255, 247, 231, .14);
    }

    .service-grid {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .service-card {
      min-height: 158px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      border: 1px solid rgba(255, 247, 231, .18);
      border-radius: 8px;
      padding: 18px;
      color: var(--cream);
      background: rgba(5, 25, 28, .38);
      box-shadow: 0 18px 34px rgba(0, 0, 0, .18);
    }

    .service-card b {
      display: block;
      font-family: "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(27px, 3.3vw, 42px);
      line-height: .92;
    }

    .service-card span {
      display: block;
      margin-top: 9px;
      color: rgba(255, 247, 231, .72);
      font-size: 14px;
    }

    .service-card a,
    .contact-actions a {
      width: fit-content;
      border-radius: 8px;
      padding: 10px 12px;
      color: #211610;
      background: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .story-cover {
      position: relative;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      align-items: center;
      padding: clamp(62px, 8vw, 110px) clamp(18px, 4vw, 64px);
      overflow: hidden;
      color: var(--cream);
      background:
        linear-gradient(90deg, rgba(5, 25, 28, .98) 0%, rgba(5, 25, 28, .78) 45%, rgba(5, 25, 28, .34) 100%),
        url("./portada-letrero-almibar.jpg") center 42% / cover no-repeat;
    }

    .story-cover::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .34;
      background:
        url("./flores-soft/flor-azul-soft.png") right -130px top 10% / 360px auto no-repeat,
        url("./flores-soft/flor-amarilla-soft.png") left -120px bottom 6% / 310px auto no-repeat;
      pointer-events: none;
    }

    .story-cover .topbar {
      position: relative;
      z-index: 1;
      align-self: start;
      padding-top: 0;
    }

    .story-wrap {
      position: relative;
      align-self: center;
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, .72fr) minmax(300px, .58fr);
      gap: clamp(32px, 6vw, 86px);
      align-items: center;
    }

    .story-title {
      max-width: 760px;
      margin: 0;
      font-family: "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(52px, 8.8vw, 128px);
      line-height: .86;
      letter-spacing: 0;
    }

    .story-lead {
      max-width: 64ch;
      margin: 28px 0 0;
      color: rgba(255, 247, 231, .78);
      font-size: clamp(18px, 2vw, 23px);
    }

    .story-note {
      display: grid;
      gap: 16px;
      border-radius: 8px;
      padding: clamp(22px, 3vw, 34px);
      background: rgba(11, 38, 44, .82);
      border: 1px solid rgba(212, 155, 90, .28);
      box-shadow: var(--shadow);
    }

    .story-note p {
      margin: 0;
      color: rgba(255, 247, 231, .82);
      font-size: clamp(15px, 1.5vw, 17px);
    }

    .story-note strong {
      display: block;
      color: var(--gold);
      font-family: "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(32px, 4vw, 52px);
      line-height: .95;
    }

    .story-lines {
      display: grid;
      gap: 10px;
      margin-top: 26px;
      color: rgba(255, 247, 231, .72);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .story-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }

    .story-actions a {
      border-radius: 8px;
      padding: 12px 14px;
      color: #211610;
      background: var(--gold);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .story-actions a:last-child {
      color: var(--cream);
      background: rgba(255, 247, 231, .1);
      border: 1px solid rgba(255, 247, 231, .2);
    }

    .photo-board {
      position: relative;
      min-height: 600px;
    }

    .photo-frame {
      position: absolute;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: var(--shadow);
      background: var(--paper);
    }

    .photo-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 8px solid rgba(255, 247, 231, .92);
      border-radius: 8px;
      pointer-events: none;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-main {
      right: 0;
      bottom: 44px;
      width: min(430px, 74vw);
      aspect-ratio: 3 / 4;
      transform: rotate(2.4deg);
      animation: hero-photo-main 8s cubic-bezier(.16, 1, .3, 1) infinite alternate;
    }

    .photo-wide {
      left: 0;
      top: 28px;
      width: min(390px, 70vw);
      aspect-ratio: 16 / 10;
      transform: rotate(-3deg);
    }

    .photo-small {
      left: 56px;
      bottom: 0;
      width: min(230px, 46vw);
      aspect-ratio: 3 / 4;
      transform: rotate(5deg);
      animation: hero-photo-small 7s cubic-bezier(.16, 1, .3, 1) infinite alternate;
      animation-delay: -1.6s;
    }

    @keyframes hero-photo-main {
      from {
        transform: translate3d(0, 0, 0) rotate(2.4deg);
      }

      to {
        transform: translate3d(0, -16px, 0) rotate(.8deg);
      }
    }

    @keyframes hero-photo-small {
      from {
        transform: translate3d(0, 0, 0) rotate(5deg);
      }

      to {
        transform: translate3d(12px, -18px, 0) rotate(8deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .photo-main,
      .photo-small {
        animation: none;
      }
    }

    .quickbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-block: 1px solid rgba(255, 247, 231, .16);
      background: rgba(5, 25, 28, .91);
      backdrop-filter: blur(18px);
      box-shadow: 0 12px 34px rgba(0, 0, 0, .22);
    }

    .quickbar-inner {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      padding: 10px 0;
    }

    .station-nav {
      display: flex;
      gap: 8px;
      white-space: nowrap;
    }

    .station-nav a {
      border-radius: 8px;
      padding: 10px 13px;
      color: #24190f;
      background: var(--gold);
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .category-rail {
      min-width: 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .category-rail::-webkit-scrollbar {
      display: none;
    }

    .category-rail a {
      flex: 0 0 auto;
      border: 1px solid rgba(255, 247, 231, .18);
      border-radius: 8px;
      padding: 9px 12px;
      color: rgba(255, 247, 231, .86);
      background: rgba(255, 247, 231, .06);
      font-size: 13px;
      font-weight: 800;
    }

    .category-rail a.active,
    .category-rail a:focus-visible,
    .topbar a:focus-visible,
    .hero-actions a:focus-visible {
      outline: 3px solid rgba(215, 170, 88, .5);
      outline-offset: 2px;
      background: rgba(215, 170, 88, .18);
    }

    .section-head {
      position: relative;
      min-height: 74svh;
      display: grid;
      align-items: end;
      padding: clamp(70px, 10vw, 130px) clamp(18px, 4vw, 64px) clamp(42px, 7vw, 92px);
      isolation: isolate;
    }

    .section-head::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: var(--head-image) center / cover no-repeat;
      filter: saturate(1.08);
    }

    .section-head::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, rgba(5, 25, 28, .92), rgba(5, 25, 28, .48), rgba(5, 25, 28, .78));
    }

    .section-head-inner {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, .88fr) minmax(250px, .45fr);
      gap: clamp(28px, 5vw, 70px);
      align-items: end;
    }

    .section-kicker {
      margin: 0 0 12px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .section-title {
      margin: 0;
      font-family: "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(58px, 11vw, 156px);
      line-height: .85;
      letter-spacing: 0;
    }

    .section-head p {
      max-width: 52ch;
      margin: 24px 0 0;
      color: rgba(255, 247, 231, .78);
      font-size: clamp(17px, 2vw, 21px);
    }

    .section-count {
      border-left: 1px solid rgba(255, 247, 231, .28);
      padding-left: 22px;
      color: rgba(255, 247, 231, .82);
    }

    .section-count strong {
      display: block;
      color: var(--cream);
      font-family: "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(42px, 7vw, 92px);
      line-height: .9;
    }

    .menu-band {
      position: relative;
      padding: clamp(56px, 7vw, 92px) clamp(18px, 4vw, 64px);
      background:
        url("./flores-soft/flor-amarilla-soft.png") right -140px top 90px / 280px auto no-repeat,
        var(--paper);
      color: var(--ink);
    }

    .menu-band.dark {
      background:
        url("./flores-soft/flor-azul-soft.png") left -120px top 120px / 300px auto no-repeat,
        linear-gradient(180deg, #071f26, #092d31 58%, #061f24);
      color: var(--cream);
    }

    .menu-layout {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 420px);
      gap: clamp(34px, 5vw, 76px);
      align-items: start;
    }

    .menu-layout.flip {
      grid-template-columns: minmax(260px, 420px) minmax(0, 1fr);
    }

    .menu-layout.flip .chapter-copy {
      order: 2;
    }

    .menu-layout.flip .media-column {
      order: 1;
    }

    .chapter-title {
      margin: 0 0 28px;
      font-family: "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(42px, 6.2vw, 86px);
      line-height: .9;
      letter-spacing: 0;
      color: inherit;
    }

    .chapter-title small {
      display: block;
      margin-top: 7px;
      color: var(--coral);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .dark .chapter-title small {
      color: var(--blue);
    }

    .menu-list {
      display: grid;
      gap: 0;
    }

    .dish {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      padding: 18px 0;
      border-top: 1px solid rgba(23, 34, 38, .18);
    }

    .dark .dish {
      border-color: rgba(255, 247, 231, .16);
    }

    .dish h3 {
      margin: 0;
      font-size: clamp(17px, 1.7vw, 22px);
      line-height: 1.14;
      letter-spacing: 0;
    }

    .dish p {
      max-width: 62ch;
      margin: 6px 0 0;
      color: rgba(23, 34, 38, .66);
      font-size: clamp(14px, 1.3vw, 16px);
    }

    .dark .dish p {
      color: rgba(255, 247, 231, .67);
    }

    .price {
      padding-top: 1px;
      font-family: "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(19px, 2.2vw, 30px);
      font-weight: 800;
      white-space: nowrap;
    }

    .media-column {
      position: sticky;
      top: 92px;
      display: grid;
      gap: 16px;
    }

    .media-card {
      overflow: hidden;
      border-radius: 8px;
      box-shadow: var(--shadow);
      background: var(--deep);
    }

    .media-card img {
      width: 100%;
      height: 100%;
      min-height: 250px;
      object-fit: cover;
    }

    .media-card.tall {
      aspect-ratio: 4 / 5;
    }

    .media-card.wide {
      aspect-ratio: 16 / 10;
    }

    .callout {
      display: grid;
      gap: 12px;
      padding: 22px;
      border-radius: 8px;
      color: var(--cream);
      background: #4c1241;
      box-shadow: 0 22px 42px rgba(0, 0, 0, .25);
    }

    .callout b {
      font-family: "Bodoni 72", Didot, Georgia, serif;
      font-size: 34px;
      line-height: .95;
    }

    .callout span {
      color: rgba(255, 247, 231, .72);
      font-size: 14px;
    }

    .benefits-band {
      padding: clamp(58px, 7vw, 96px) clamp(18px, 4vw, 64px);
      background:
        url("./flores-soft/flor-naranja-soft.png") left -130px top 70px / 310px auto no-repeat,
        linear-gradient(135deg, #4c1241 0%, #071f26 54%, #0d4a42 100%);
      color: var(--cream);
    }

    .benefits-wrap {
      width: min(1180px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, .72fr) minmax(0, 1fr);
      gap: clamp(32px, 5vw, 76px);
      align-items: start;
    }

    .benefits-title {
      margin: 0;
      font-family: "Bodoni 72", Didot, Georgia, serif;
      font-size: clamp(50px, 8vw, 116px);
      line-height: .86;
      letter-spacing: 0;
    }

    .benefits-copy p {
      max-width: 50ch;
      margin: 22px 0 0;
      color: rgba(255, 247, 231, .74);
      font-size: clamp(16px, 1.8vw, 20px);
    }

    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .benefit-item {
      min-height: 152px;
      border: 1px solid rgba(255, 247, 231, .16);
      border-radius: 8px;
      padding: 18px;
      background: rgba(5, 25, 28, .36);
    }

    .benefit-item strong {
      display: block;
      font-size: 18px;
      line-height: 1.12;
    }

    .benefit-item span {
      display: block;
      margin-top: 8px;
      color: rgba(255, 247, 231, .7);
      font-size: 14px;
    }

    /* ==== Happy Hour — bloque desmontable ==== */
    .hh-band {
      padding: clamp(30px, 5vw, 66px) clamp(16px, 4vw, 48px);
      background:
        radial-gradient(120% 90% at 100% 0%, rgba(232, 163, 60, .16), transparent 58%),
        #0e1f24;
      border-top: 1px solid rgba(212, 155, 90, .25);
      border-bottom: 1px solid rgba(212, 155, 90, .25);
    }
    .hh-inner { max-width: 1120px; margin: 0 auto; }
    .hh-kicker {
      margin: 0 0 6px; font-size: 13px; font-weight: 800;
      letter-spacing: .28em; text-transform: uppercase; color: #E8A33C;
    }
    .hh-title {
      margin: 0; line-height: .95; color: #F5F1EA;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 700; font-size: clamp(46px, 9vw, 92px);
    }
    .hh-sub { margin: 10px 0 22px; max-width: 52ch; color: #D8D2C6; font-size: clamp(16px, 2.2vw, 20px); }
    .hh-sub .hh-lead { color: #F2B84B; font-weight: 800; }
    /* Dos precios, dos tarjetas. El de socio manda visualmente porque es el que
       queremos que la gente pida; el general va al lado para que se vea la brecha. */
    .hh-precios { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 0 0 30px; }
    @media (max-width: 620px) { .hh-precios { grid-template-columns: 1fr; } }
    .hh-precio {
      position: relative; display: flex; flex-direction: column;
      padding: 22px 20px 18px; border-radius: 16px;
      background: rgba(11, 38, 44, .72); border: 1px solid rgba(232, 163, 60, .34);
    }
    .hh-precio--top { background: rgba(232, 163, 60, .13); border-color: rgba(242, 184, 75, .78); }
    .hh-precio-badge {
      position: absolute; top: -10px; left: 18px; padding: 3px 10px; border-radius: 20px;
      background: #F2B84B; color: #0B262C; font-size: 11px; font-weight: 900;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .hh-precio-name { margin: 2px 0 6px; font-size: 13px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: #E8A33C; }
    .hh-precio-price { font-size: clamp(40px, 8vw, 60px); font-weight: 900; color: #F2B84B; line-height: .95; }
    .hh-precio-desc { margin: 12px 0 0; font-size: clamp(14.5px, 2vw, 16px); line-height: 1.5; color: #F5F1EA; font-weight: 600; }
    .hh-precio-desc em { font-style: normal; color: #C9C2B4; font-weight: 500; }
    .hh-listtitle {
      margin: 0 0 14px; font-size: 13px; font-weight: 800;
      letter-spacing: .22em; text-transform: uppercase; color: #E8A33C;
    }
    /* Multi-columna en vez de grid: los grupos tienen 1 a 4 productos y con
       filas fijas los de un solo trago dejaban una fila entera vacía. Así se
       empaquetan por altura y la sección queda un tercio más corta. */
    .hh-grid { columns: 3; column-gap: 20px; }
    @media (max-width: 900px) { .hh-grid { columns: 2; } }
    @media (max-width: 560px) { .hh-grid { columns: 1; } }
    .hh-group {
      break-inside: avoid; -webkit-column-break-inside: avoid;
      display: inline-block; width: 100%; margin: 0 0 12px;
      padding: 16px 18px; border-radius: 14px;
      background: rgba(11, 38, 44, .55); border: 1px solid rgba(212, 155, 90, .22);
    }
    .hh-group-name {
      margin: 0 0 10px; font-size: 12px; font-weight: 900;
      letter-spacing: .14em; text-transform: uppercase; color: #D49B5A;
    }
    .hh-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .hh-item { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .hh-item-name { color: #F5F1EA; font-size: 15.5px; font-weight: 600; line-height: 1.3; }
    /* El precio de carta va tachado: es el ancla que hace legible el descuento. */
    .hh-item-was { color: #9AA5A3; font-size: 14px; font-weight: 600; text-decoration: line-through; white-space: nowrap; }
    .hh-foot { margin: 22px 0 0; font-size: 13.5px; color: #B9B2A4; font-style: italic; }

    /* ==== Tenedor Libre (jueves) — bloque desmontable ==== */
    .tl-band {
      padding: clamp(30px, 5vw, 66px) clamp(16px, 4vw, 48px);
      background:
        radial-gradient(120% 90% at 0% 0%, rgba(224, 83, 59, .18), transparent 55%),
        #0b262c;
      border-top: 1px solid rgba(212, 155, 90, .25);
      border-bottom: 1px solid rgba(212, 155, 90, .25);
    }
    .tl-inner { max-width: 1120px; margin: 0 auto; }
    .tl-kicker {
      margin: 0 0 6px; font-size: 13px; font-weight: 800;
      letter-spacing: .28em; text-transform: uppercase; color: #E8A33C;
    }
    .tl-title {
      margin: 0; line-height: .95; color: #F5F1EA;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 700; font-size: clamp(46px, 9vw, 92px);
    }
    .tl-sub { margin: 10px 0 14px; max-width: 44ch; color: #D8D2C6; font-size: clamp(16px, 2.2vw, 20px); }
    .tl-sub .tl-lead { color: #F2B84B; font-weight: 800; font-size: 1.15em; letter-spacing: .005em; }
    .tl-noadd { margin: 0 0 26px; max-width: 56ch; color: #EDC988; font-size: 14.5px; line-height: 1.55; font-weight: 600; }
    /* Dos formatos, dos tarjetas: el de menor precio debe leerse tan claro como
       el otro o la gente no se entera de que existe. */
    .tl-planes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 14px 0 22px; }
    @media (max-width: 900px) { .tl-planes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 620px) { .tl-planes { grid-template-columns: 1fr; } }
    .tl-plan {
      position: relative; display: flex; flex-direction: column;
      padding: 20px 20px 18px; border-radius: 16px;
      background: rgba(11, 38, 44, .72); border: 1px solid rgba(232, 163, 60, .34);
    }
    .tl-plan--top { background: rgba(232, 163, 60, .13); border-color: rgba(242, 184, 75, .78); }
    /* El bebestible ya no es un plan alternativo sino un complemento del de
       $18.900: se muestra como "+$8.000" y con borde punteado para que se lea
       como algo que se suma, no como otro precio con el que hay que comparar. */
    .tl-plan--add { border-style: dashed; border-color: rgba(232, 163, 60, .55); }
    .tl-plan-badge--add { background: #0B262C; color: #F2B84B; border: 1px solid rgba(242, 184, 75, .78); }
    .tl-plan-plus { font-size: .62em; vertical-align: .22em; margin-right: .04em; color: #E8A33C; }
    .tl-plan-badge {
      position: absolute; top: -10px; left: 18px; padding: 3px 10px; border-radius: 20px;
      background: #F2B84B; color: #0B262C; font-size: 11px; font-weight: 900;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .tl-plan-name { margin: 2px 0 6px; font-size: 13px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: #E8A33C; }
    .tl-plan-price { font-size: clamp(38px, 8vw, 58px); font-weight: 900; color: #F2B84B; line-height: .95; }
    .tl-plan-per { display: block; margin-top: 2px; font-size: 14px; font-weight: 700; color: #D8D2C6; letter-spacing: .02em; }
    .tl-plan-desc { margin: 12px 0 0; font-size: clamp(15px, 2.1vw, 17px); line-height: 1.5; color: #F5F1EA; font-weight: 600; }
    .tl-plan-desc em { font-style: normal; color: #C9C2B4; font-weight: 500; }
    .tl-compare { margin: 0 0 22px; font-style: italic; font-size: 13.5px; color: #B9B2A4; }
    .tl-tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .tl-tier {
      background: rgba(11, 38, 44, .7); border: 1px solid rgba(212, 155, 90, .28);
      border-radius: 14px; padding: 18px;
    }
    .tl-tier-premium {
      border-color: #E0533B;
      background: linear-gradient(160deg, rgba(224, 83, 59, .16), rgba(11, 38, 44, .7));
    }
    .tl-tier h3 { margin: 0 0 8px; font-size: 20px; font-weight: 800; color: #F5F1EA; }
    .tl-price { margin: 0; font-size: 26px; font-weight: 900; color: #F2B84B; }
    .tl-price span { display: block; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: #B9B2A4; }
    .tl-price-alt { margin: 2px 0 10px; font-size: 13px; color: #C9BCA8; }
    .tl-inc { margin: 0; font-size: 13px; line-height: 1.5; color: #C9C2B4; }
    .tl-schop {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px;
      margin-top: 16px; padding: 16px 18px; border-radius: 14px;
      background: rgba(11, 38, 44, .75); border: 1px solid rgba(232, 163, 60, .5);
    }
    .tl-schop-price { font-size: clamp(22px, 4vw, 30px); font-weight: 900; color: #F2B84B; }
    .tl-schop-copy { font-size: 14.5px; line-height: 1.5; color: #D8D2C6; }
    .tl-schop-copy em { color: #B9B2A4; font-style: normal; }
    .tl-cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-top: 20px; align-items: start; }
    .tl-how h4, .tl-nowaste h4 {
      margin: 0 0 10px; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #E8A33C;
    }
    .tl-how ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
    .tl-how li { font-size: 14px; line-height: 1.5; color: #D3CCBE; }
    .tl-nowaste { background: rgba(11, 38, 44, .82); border: 1px solid rgba(212, 155, 90, .32); border-top: 3px solid #E66A5B; border-radius: 16px; padding: 22px; }
    .tl-nowaste h4 { color: #D9C29C; }
    .tl-nowaste p { margin: 0; font-size: 15px; line-height: 1.6; font-weight: 500; color: #F5F1EA; }
    @media (max-width: 760px) {
      .tl-tiers { grid-template-columns: 1fr; }
      .tl-cols { grid-template-columns: 1fr; }
    }

    /* ==== Marcador de visitas (Club) ==== */
    .visit-tracker {
      display: flex; align-items: center; gap: 14px;
      margin: 4px 0 18px; padding: 14px 16px;
      background: rgba(11, 38, 44, .55);
      border: 1px solid rgba(212, 155, 90, .3); border-radius: 14px;
    }
    .visit-stamps { display: flex; gap: 8px; flex-shrink: 0; }
    .visit-stamps .stamp {
      width: 30px; height: 30px; border-radius: 50%;
      border: 2px dashed rgba(212, 155, 90, .6); background: transparent; position: relative;
    }
    .visit-stamps .stamp.filled {
      border-style: solid; border-color: #E8A33C;
      background: linear-gradient(135deg, #E0533B, #E8A33C);
    }
    .visit-stamps .stamp.filled::after {
      content: "★"; position: absolute; inset: 0;
      display: grid; place-items: center; color: #2a0f0a; font-size: 15px;
    }
    .visit-tracker-copy { display: grid; gap: 2px; min-width: 0; }
    .visit-tracker-copy strong { color: #F5F1EA; font-size: 15px; }
    .visit-tracker-copy span { color: #C9BCA8; font-size: 12.5px; }

    /* Portada: foto de la fachada con el letrero iluminado, anclada abajo en la
       columna derecha (proporción natural 4:3 → letrero completo, sin recortar,
       y deja ver la muralla del fondo por arriba). */
    .story-photo {
      margin: 0; align-self: center; position: relative;
      aspect-ratio: 16 / 6; border-radius: 16px; overflow: hidden;
      border: 1px solid rgba(212, 155, 90, .38);
      box-shadow: 0 26px 64px rgba(0, 0, 0, .55);
    }
    .story-photo img {
      display: block; width: 100%; height: 100%;
      object-fit: cover; object-position: 50% 30%;
    }
    @media (max-width: 900px) { .story-photo { aspect-ratio: 16 / 8; } }

    /* Botón "Estoy en Almíbar" para marcar visita (solo socios reconocidos) */
    .visit-actions { margin: -6px 0 18px; display: grid; gap: 8px; }
    .visit-mark-btn {
      display: inline-flex; align-items: center; gap: 12px; width: 100%;
      padding: 13px 16px; border: none; border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, #E0533B, #E8A33C); color: #2a0f0a;
      text-align: left; font: inherit;
      box-shadow: 0 8px 20px rgba(224, 83, 59, .28);
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }
    .visit-mark-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(224, 83, 59, .34); }
    .visit-mark-btn:active { transform: translateY(0); }
    .visit-mark-btn[disabled] { opacity: .65; cursor: default; box-shadow: none; transform: none; }
    .visit-mark-btn__pin { font-size: 22px; flex-shrink: 0; }
    .visit-mark-btn__txt { display: grid; gap: 1px; }
    .visit-mark-btn__txt strong { font-size: 15.5px; font-weight: 800; }
    .visit-mark-btn__txt span { font-size: 12px; opacity: .85; }

<body class="reservation-page">
  <!--
    THESIS: Reservar en Almíbar debe sentirse como tomar lugar en la noche del local, no como llenar un formulario genérico.
    OWN-WORLD: fondo vegetal real, teal profundo, papel cálido, controles dorados y lenguaje de mesa nocturna.
    STORY: el cliente elige motivo, fecha, hora y contacto; la reserva entra al POS con la misma RPC pública vigente.
    FIRST VIEWPORT: título grande a la izquierda, datos de operación y formulario completo visible a la derecha.
    FORM: extensión directa del mundo visual de la carta; seed manual-user-reference.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <main class="site">
    <section class="reservation-hero">
      <div class="reservation-topbar">
        <a href="./index.html">← Inicio</a>
      </div>

      <div class="reservation-shell">
        <header class="reservation-head">
          <h1 class="reservation-title">Reservar mesa</h1>
        </header>

        <section class="reservation-panel" aria-label="Formulario de reserva">

            <section class="reserve-section" data-step="motivo">
              <fieldset>

                <input type="hidden" id="motivo" name="motivo" value="Celebración">
                <div class="motivo-grid" id="motivo-grid">
                  <button class="motivo-option" type="button" data-motivo="Cumpleaños">Cumpleaños</button>
                  <button class="motivo-option active" type="button" data-motivo="Celebración">Celebración</button>
                  <button class="motivo-option" type="button" data-motivo="Reunión">Reunión</button>
                  <button class="motivo-option" type="button" data-motivo="Empresa">Empresa</button>
                  <button class="motivo-option" type="button" data-motivo="Otro">Otro</button>
                </div>
              </fieldset>
            </section>

            <section class="reserve-section" data-step="personas">

                  <button class="count-option" type="button" data-count="20">20</button>
                </div>
                <label class="reserve-field count-manual">
                  <span class="reserve-label">¿Otra cantidad?</span>
                  <input id="personas" name="personas" type="number" inputmode="numeric" min="2" max="50" value="2" required>
                </label>
              </fieldset>
            </section>

              <label class="reserve-field">
                <span class="reserve-label">¿Qué día?</span>

  <script src="./reservas.js"></script>
  <script>
    /* Auto-avance guiado: al elegir un dato, la vista sube suave al paso
       siguiente. Va ENCIMA del flujo de reservas.js (no lo reemplaza):
       reservas.js sigue manejando motivo, slots, fecha y el envío al POS. */
    (function () {
      var form = document.getElementById('reservation-form');
      if (!form) return;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var steps = {};
      form.querySelectorAll('[data-step]').forEach(function (el) { steps[el.dataset.step] = el; });

      function goTo(name) {
        var el = steps[name];
        if (!el) return;
        // rAF: deja que el paso previo termine su render (p.ej. los slots) antes de mover la vista.
        window.requestAnimationFrame(function () {
          el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
        });
      }

      // 1) Motivo -> Personas
      var motivoGrid = document.getElementById('motivo-grid');
      if (motivoGrid) {
        motivoGrid.addEventListener('click', function (e) {
          if (e.target.closest('[data-motivo]')) goTo('personas');
        });
      }

      // 2) Personas: chips rápidos -> Día
      var countGrid = document.getElementById('count-grid');
      var personas = document.getElementById('personas');
      function syncCountChips(n) {
        if (!countGrid) return;
        countGrid.querySelectorAll('.count-option').forEach(function (b) {
          b.classList.toggle('active', Number(b.dataset.count) === n);
        });
      }
      if (countGrid && personas) {
        countGrid.addEventListener('click', function (e) {
          var btn = e.target.closest('[data-count]');
          if (!btn) return;
          personas.value = btn.dataset.count;
          syncCountChips(Number(btn.dataset.count));
          goTo('fecha');
        });
      }
      // 2b) Personas: número manual -> Día (al terminar de escribir)
      if (personas) {
        personas.addEventListener('change', function () {
          var n = Number(personas.value);
          syncCountChips(n);
          if (isFinite(n) && n >= 2 && n <= 50) goTo('fecha');
        });
      }

      // 3) Día -> Hora (después de que reservas.js pinte los slots del día)
      var fecha = document.getElementById('fecha');
      if (fecha) {
        fecha.addEventListener('change', function () { goTo('hora'); });
      }

      // 4) Hora: al elegir un slot (delegado, porque se crean dinámicamente) -> Datos
      var slotGrid = document.getElementById('slot-grid');
      if (slotGrid) {
        slotGrid.addEventListener('click', function (e) {
          if (e.target.closest('.slot-option')) goTo('datos');
        });
      }

      // 5) Datos: al completar un WhatsApp válido -> Notas / Enviar
      var celular = document.getElementById('celular');
      if (celular) {
        celular.addEventListener('change', function () {
          if (String(celular.value).replace(/\D/g, '').length >= 8) goTo('notas');
        });
      }
    })();
  </script>
</body>
</html>
