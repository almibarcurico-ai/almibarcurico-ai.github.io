    <!-- Splash de marca Almíbar: se pinta al instante mientras carga el bundle -->
    <style id="almibar-splash-css">
      #almibar-splash{position:fixed;inset:0;z-index:9999;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
        background:radial-gradient(120% 55% at 50% 0%, #123a45 0%, #0B2D36 45%, #071f26 100%);
        color:#F5F1EA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        opacity:1;transition:opacity .45s ease}
      #almibar-splash.out{opacity:0;pointer-events:none}
      #almibar-splash .logo{width:132px;height:132px;border-radius:50%;
        box-shadow:0 10px 40px rgba(0,0,0,.35);animation:sp-pulse 2.4s ease-in-out infinite}
      #almibar-splash .brand{font-size:14px;letter-spacing:.34em;text-indent:.34em;color:#D9C29C;font-weight:600;margin-top:4px}
      #almibar-splash .sub{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:15px;color:#E6A456;letter-spacing:.02em}
      #almibar-splash .dots{display:flex;gap:7px;margin-top:6px}
      #almibar-splash .dots i{width:7px;height:7px;border-radius:50%;background:#D08B3E;display:block;animation:sp-dot 1.3s infinite ease-in-out}
      #almibar-splash .dots i:nth-child(2){animation-delay:.16s}
      #almibar-splash .dots i:nth-child(3){animation-delay:.32s}
      @keyframes sp-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.95);opacity:.9}}
      @keyframes sp-dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
      #almibar-splash .fail{display:none;max-width:280px;font-size:14px;line-height:1.5;color:#D9C29C}
      #almibar-splash.failed .dots{display:none}
      #almibar-splash.failed .sub{display:none}
      #almibar-splash.failed .fail{display:block}
      #almibar-splash .fail button{margin-top:14px;padding:12px 28px;border:0;border-radius:40px;
        background:#D08B3E;color:#20140a;font-size:15px;font-weight:700;cursor:pointer}
      @media (prefers-reduced-motion:reduce){#almibar-splash .logo,#almibar-splash .dots i{animation:none}}
    </style>

  <body>
    <noscript>
      <div style="position:fixed;inset:0;background:#0B2D36;color:#F5F1EA;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:sans-serif">
        Activa JavaScript para usar la app de Almíbar.<br />O escríbenos por Instagram @almibar.bar
      </div>
    </noscript>

    <div id="almibar-splash" role="status" aria-label="Cargando Almíbar">
      <img class="logo" src="/icon-192.png" alt="" width="132" height="132" />
      <div class="brand">ALMÍBAR</div>
      <div class="sub">Bar Nikkei · Curicó</div>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="fail">
        La app está tardando más de lo normal.
        <br /><button onclick="location.reload()">Reintentar</button>
      </div>
    </div>

    <div id="root"></div>

    <script>
    /* Desmonta el splash cuando la app Expo monta en #root (o ante fallo). */
    (function(){
      var splash=document.getElementById('almibar-splash'), done=false;
      function hide(){ if(done)return; done=true; splash.classList.add('out');
        setTimeout(function(){ if(splash&&splash.parentNode) splash.parentNode.removeChild(splash); },500); }
      function mounted(){
        var root=document.getElementById('root');
        return root && root.children.length>0 && root.firstElementChild &&
               root.firstElementChild.getBoundingClientRect().height>0;
      }
      try{
        var obs=new MutationObserver(function(){ if(mounted()){ obs.disconnect(); setTimeout(hide,120); } });
        obs.observe(document.getElementById('root'),{childList:true,subtree:true});
      }catch(e){}
      var poll=setInterval(function(){ if(done){clearInterval(poll);return;} if(mounted()){clearInterval(poll);hide();} },250);
      window.addEventListener('error',function(ev){
        if(ev&&ev.target&&ev.target.tagName==='SCRIPT'&&!done) splash.classList.add('failed');
      },true);
      setTimeout(function(){ if(!done) splash.classList.add('failed'); },15000);
    })();
    </script>

    <script>
    /* Fondo floral Almíbar — pinta las flores de marca detrás del contenido en las
       pantallas de fondo claro (arena #FBF7F1). No toca layout, theme ni bundle. */
    (function(){
      var FLORES=[
        {u:'/flores-soft/flor-amarilla-soft.png',s:'210px',p:'left -55px top 95px'},
        {u:'/flores-soft/flor-roja-soft.png',s:'195px',p:'right -60px top 380px'},
        {u:'/flores-soft/flor-azul-soft.png',s:'195px',p:'left -58px top 690px'},
        {u:'/flores-soft/flor-naranja-soft.png',s:'220px',p:'right -50px bottom 70px'}
      ];
      function apply(){
        var root=document.getElementById('root'); if(!root) return;
        var divs=root.getElementsByTagName('div'), target=null, best=0;
        for(var i=0;i<divs.length;i++){
          var d=divs[i];
          if(getComputedStyle(d).backgroundColor==='rgb(251, 247, 241)'){
            var h=d.getBoundingClientRect().height;
            if(h>best){best=h;target=d;}
          }
        }
        if(target && target.getAttribute('data-flores')!=='1'){
          target.setAttribute('data-flores','1');
          target.style.backgroundImage=FLORES.map(function(f){return 'url('+f.u+')';}).join(',');
          target.style.backgroundRepeat='no-repeat,no-repeat,no-repeat,no-repeat';
          target.style.backgroundSize=FLORES.map(function(f){return f.s;}).join(',');
          target.style.backgroundPosition=FLORES.map(function(f){return f.p;}).join(',');
          target.style.backgroundAttachment='fixed,fixed,fixed,fixed';
        }
      }
      function boot(){
        apply();
        try{var obs=new MutationObserver(function(){requestAnimationFrame(apply);});
          obs.observe(document.getElementById('root'),{childList:true,subtree:true});}catch(e){}
        setInterval(apply,1500);
      }
      if(document.readyState!=='loading') setTimeout(boot,1200);
      else document.addEventListener('DOMContentLoaded',function(){setTimeout(boot,1200);});
    })();
    </script>
